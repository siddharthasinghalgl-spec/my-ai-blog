<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>AURA AI | Ultra Autonomous Verified Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; background: #f8fafc; } .full-content { display: none; }</style>
</head>
<body>
    <header class="bg-slate-900 text-white p-6 sticky top-0 z-50 flex justify-between items-center shadow-xl">
        <h1 class="text-2xl font-black uppercase tracking-tighter">AURA <span class="text-blue-500">AI</span></h1>
        <div class="text-[10px] font-bold text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full uppercase tracking-widest">
            <i class="fas fa-circle animate-pulse mr-1"></i> AI Neural Sync Active
        </div>
    </header>

    <main class="max-w-7xl mx-auto py-12 px-4">
        <div id="blog-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
    </main>

    <script>
        async function loadBlogs() {
            try {
                const container = document.getElementById('blog-container');
                const response = await fetch('database.json');
                const blogs = await response.json();
                container.innerHTML = blogs.map(post => `
                    <div class="bg-white p-8 rounded-[2rem] shadow-xl border border-slate-100 flex flex-col">
                        <span class="bg-blue-100 text-blue-600 text-[10px] font-black px-3 py-1 rounded-full uppercase w-fit">${post.category}</span>
                        <h2 class="text-xl font-bold text-slate-800 my-4">${post.title}</h2>
                        <div id="full-${post.id}" class="full-content bg-slate-50 p-6 rounded-2xl italic border-l-4 border-blue-600 text-sm text-slate-600 leading-loose">
                            ${post.content}
                            <div class="mt-6 pt-4 border-t border-blue-100">
                                <p class="text-[10px] font-bold text-blue-800 uppercase tracking-widest">Verified AI Source: ${post.source}</p>
                            </div>
                        </div>
                        <button onclick="toggleRead(${post.id})" id="btn-${post.id}" class="mt-4 bg-slate-900 text-white text-[11px] font-black uppercase px-6 py-3 rounded-xl">Read Article</button>
                    </div>
                `).join('');
            } catch(e) { console.log("Waiting for database update..."); }
        }
        function toggleRead(id) {
            const f = document.getElementById(`full-${id}`);
            const b = document.getElementById(`btn-${id}`);
            if(f.style.display === "none" || f.style.display === "") {
                f.style.display = "block"; b.innerHTML = "Close Article";
            } else {
                f.style.display = "none"; b.innerHTML = "Read Article";
            }
        }
        window.onload = loadBlogs;
    </script>
</body>
</html>
